name: Repair 31 October Halloween featured image
on:
  push:
    branches: [main]
    paths:
      - 'control/halloween-image-repair.json'
permissions:
  contents: write
concurrency:
  group: liveofficialrome-importer
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0,persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install Pillow
      - run: |
          git config user.name "live-rome-controller[bot]"
          git config user.email "live-rome-controller@users.noreply.github.com"
      - name: Cache verified JPEG without creating a post
        env:
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/repair_halloween2026_image.py
