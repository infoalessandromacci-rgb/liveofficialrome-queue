name: Publish verified 5-category batch
on:
  push:
    branches: [main]
    paths:
      - 'control/publish-request.json'
  workflow_dispatch:
    inputs:
      mode:
        description: "Preflight tests WordPress access; dry-run validates candidates; publish writes live events"
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - dry-run
          - publish
permissions:
  contents: write
concurrency:
  group: liveofficialrome-importer
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (no WordPress writes)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Git author for verified event commits
        run: |
          git config user.name "live-rome-controller[bot]"
          git config user.email "live-rome-controller@users.noreply.github.com"
      - name: Run batch controller
        env:
          WP_IMPORTER_TOKEN: ${{ secrets.WP_IMPORTER_TOKEN }}
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python scripts/authorized_publish.py
          else
            case "$MODE" in
              preflight) python scripts/publish_batch.py --preflight ;;
              dry-run)   python scripts/publish_batch.py ;;
              publish)   python scripts/publish_batch.py --apply ;;
              *) echo "Invalid mode"; exit 2 ;;
            esac
          fi
      - name: Persist batch report in GitHub
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ -f reports/latest-batch.json ]; then
            python - <<'PY'
          import json, os, pathlib
          obj = json.loads(pathlib.Path("reports/latest-batch.json").read_text(encoding="utf-8"))
          obj["github_run_id"] = os.environ["RUN_ID"]
          obj["github_trigger"] = os.environ["TRIGGER"]
          target = pathlib.Path("data/batch-run-report.json")
          target.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
            git add data/batch-run-report.json
            if ! git diff --cached --quiet; then
              git commit -m "Record auditable batch run outcome"
              git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
            fi
          fi
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-rome-batch-audit
          path: reports/latest-batch.json
          if-no-files-found: warn
